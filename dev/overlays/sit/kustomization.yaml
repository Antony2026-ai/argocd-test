apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

patches:
- patch: |
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: trip-deployment-main
      namespace: main
- patch: |
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: vts-deployment-main
      namespace: main

images:
- name: kreajith2026/trip-sit
  newName: kreajith2026/trip-sit
  newTag: "23"
- name: kreajith2026/vts-sit
  newTag: "16"
