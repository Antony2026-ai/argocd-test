apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

patches:
- target:
    kind: Deployment
    name: trip-deployment-main
  patch: |
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: trip-deployment-main
- target:
    kind: Deployment
    name: vts-deployment-main
  patch: |
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: vts-deployment-main

images:
- name: kreajith2026/trip-sit
  newTag: "32"
- name: kreajith2026/vts-sit
  newTag: "3"
